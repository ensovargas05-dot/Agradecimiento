<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gracias, profe Sardon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--board:#1f3b34;--board2:#2a4d43;--chalk:#f6f3ea;--dim:#c9d6cf;--c1:#ffd166;--c2:#ff8fa3;--c3:#8fd3ff;--c4:#b8f2a0;--ink:#2b2b2b;color-scheme:dark;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--board:#14261f;--board2:#1d372e;--chalk:#f1eee4;--dim:#b7c6be}}
:root[data-theme="dark"]{--board:#14261f;--board2:#1d372e;--chalk:#f1eee4;--dim:#b7c6be}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--board);color:var(--chalk);font-family:"Nunito",system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
body.locked{overflow:hidden}
.disp{font-family:"Caveat Brush","Comic Sans MS",cursive;font-weight:400}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--c3);outline-offset:3px}

/* PORTADA */
#cover{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:#10201b;transition:transform 1.1s cubic-bezier(.77,0,.18,1);padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
#cover.open{transform:translateY(-105%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 14s ease-in-out infinite alternate}
.b1{width:55vmax;height:55vmax;background:#2f7d66;left:-15vmax;top:-15vmax}
.b2{width:45vmax;height:45vmax;background:#c1506a;right:-12vmax;bottom:-12vmax;animation-delay:-5s}
.b3{width:35vmax;height:35vmax;background:#d9a93a;left:35%;top:45%;animation-delay:-9s;opacity:.35}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.25)}}
.orbit{position:absolute;left:50%;top:50%;width:min(92vw,720px);aspect-ratio:1;margin:calc(min(92vw,720px)/-2) 0 0 calc(min(92vw,720px)/-2);animation:spin 40s linear infinite;pointer-events:none}
.orbit span{position:absolute;left:50%;top:50%;font-size:clamp(22px,4vw,38px);transform:rotate(var(--a)) translateY(calc(min(92vw,720px)/-2)) rotate(calc(var(--a)*-1));animation:counter 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes counter{to{transform:rotate(calc(var(--a) * 1 - 360deg)) translateY(calc(min(92vw,720px)/-2)) rotate(calc(var(--a)*-1 + 360deg))}}
.tag{position:relative;border:2px dashed var(--c3);border-radius:999px;padding:4px 18px;color:var(--c3);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.cover h1,#cover h1{position:relative;font-size:clamp(3.2rem,14vw,8.5rem);line-height:.95;margin:.3em 0 .15em}
#cover h1 .w{display:inline-block;white-space:nowrap}
#cover h1 .w+ .w{color:var(--c1)}
#cover h1 .l{display:inline-block;opacity:0;animation:drop .6s cubic-bezier(.2,.9,.3,1.4) forwards,wave 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*70ms),calc(1.4s + var(--i)*110ms)}
@keyframes drop{from{opacity:0;transform:translateY(-1.2em) rotate(-12deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.12em) rotate(3deg)}}
.csub{position:relative;color:var(--dim);font-size:1.1rem;max-width:30em;margin:0 0 26px;animation:rise 1s 1.6s backwards}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.go{position:relative;font-weight:700;font-size:1.15rem;color:#10201b;background:var(--c1);border:0;border-radius:999px;padding:15px 34px;box-shadow:0 0 0 0 rgba(255,209,102,.7);animation:ring 1.8s infinite,rise 1s 2s backwards;transition:transform .15s}
.go:hover{transform:scale(1.08) rotate(-2deg)}
@keyframes ring{to{box-shadow:0 0 0 26px rgba(255,209,102,0)}}
.ribbon{position:absolute;left:0;width:100%;overflow:hidden;white-space:nowrap;font-size:1.5rem;color:var(--dim);opacity:.5}
.ribbon div{display:inline-block;animation:slide 24s linear infinite}
.rt{top:calc(env(safe-area-inset-top,0px) + 8px)}.rb{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}.rb div{animation-direction:reverse}
@keyframes slide{to{transform:translateX(-50%)}}

/* CARTA */
.page{position:relative;max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 20px calc(env(safe-area-inset-bottom,0px) + 80px);overflow:hidden}
.bg{position:fixed;inset:0;overflow:hidden;background:linear-gradient(120deg,var(--board2),var(--board),#2a3f5a,var(--board));background-size:300% 300%;animation:shift 18s ease-in-out infinite;z-index:-1}
@keyframes shift{50%{background-position:100% 50%}}
.bg::before,.bg::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.22;animation:float 16s ease-in-out infinite alternate}
.bg::before{width:50vmax;height:50vmax;background:#c1506a;left:-10vmax;top:30%}
.bg::after{width:45vmax;height:45vmax;background:#d9a93a;right:-10vmax;top:-5vmax;animation-delay:-7s}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--chalk);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.9;transform:scale(1.8)}}
.shoot{position:fixed;z-index:0;width:130px;height:2px;background:linear-gradient(90deg,transparent,var(--chalk));transform:rotate(26deg);opacity:0;pointer-events:none;animation:shoot 1.3s ease-out forwards}
@keyframes shoot{0%{opacity:1;translate:0 0}100%{opacity:0;translate:460px 220px}}
.doodle{position:fixed;color:var(--dim);opacity:.25;pointer-events:none;animation:drift linear infinite,sway ease-in-out infinite alternate;z-index:0}
@keyframes drift{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
@keyframes sway{from{margin-left:-45px}to{margin-left:45px}}
.rev{opacity:0;transform:translateY(50px) scale(.96);transition:opacity .8s,transform .8s cubic-bezier(.2,.9,.3,1.2)}
.rev.in{opacity:1;transform:none}
h2{font-size:clamp(2.2rem,8vw,3.6rem);margin:0 0 14px;color:var(--c4);line-height:1.05}
.letter{background:var(--chalk);color:var(--ink);border-radius:6px 22px 8px 18px;padding:clamp(22px,5vw,44px);box-shadow:0 18px 40px rgba(0,0,0,.4);transform:rotate(-1deg);font-size:1.12rem;position:relative;min-height:15em}
.letter::after{content:"";position:absolute;right:18px;top:-14px;width:80px;height:28px;background:rgba(255,209,102,.8);transform:rotate(6deg)}
#typed{white-space:pre-wrap;margin:0}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-.2em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:60px 0}
.card{color:inherit;text-align:left;background:none;border:0;padding:0;perspective:900px;min-height:200px;animation:bob 5s ease-in-out infinite}
.card:nth-child(2){animation-delay:-1.7s}.card:nth-child(3){animation-delay:-3.4s}
@keyframes bob{50%{transform:translateY(-10px)}}
.inn{position:relative;display:block;width:100%;min-height:200px;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card[aria-pressed="true"] .inn{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--dim);border-radius:18px 8px 20px 10px;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.face b{font-family:"Caveat Brush",cursive;font-weight:400;font-size:1.8rem;color:var(--c1)}
.back{transform:rotateY(180deg);background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.back b{color:#b3415a}
.stage{text-align:center;padding:30px 0}
.hug{font-weight:700;font-size:1.2rem;color:#14261f;background:var(--c2);border:0;border-radius:16px;padding:16px 30px;box-shadow:0 6px 0 #c4627a;transition:transform .12s,box-shadow .12s}
.hug:hover{animation:jig .4s}.hug:active{transform:translateY(5px);box-shadow:0 1px 0 #c4627a}
@keyframes jig{25%{transform:rotate(-4deg) scale(1.06)}75%{transform:rotate(4deg) scale(1.06)}}
.count{display:block;margin-top:14px;color:var(--dim)}
footer{text-align:center;color:var(--dim);margin-top:40px}
footer p{font-size:2rem;color:var(--chalk);margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.doodle{display:none}.rev{opacity:1;transform:none}}
</style>
</head>
<body class="locked">
<canvas id="fx" aria-hidden="true"></canvas>
<div class="bg"></div>

<section id="cover" aria-label="Portada">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="ribbon rt" aria-hidden="true"><div class="disp" id="rt"></div></div>
  <div class="orbit" id="orbit" aria-hidden="true"></div>
  <span class="tag">Despedida de 5.º · 24 de noviembre de 2026</span>
  <h1 class="disp" id="title" aria-label="Gracias, Teacher Sardon"></h1>
  <p class="csub">Marco A. Sardon, el tutor de 4.º B que se encargó de despedirnos. Esto es mi agradecimiento para él.</p>
  <button class="go" id="open" type="button">Abrir mi mensaje</button>
  <div class="ribbon rb" aria-hidden="true"><div class="disp" id="rb"></div></div>
</section>

<main class="page" id="page">
  <section class="rev">
    <h2 class="disp">Teacher Sardon:</h2>
    <div class="letter"><p id="typed" aria-live="off"></p><span class="caret" aria-hidden="true"></span></div>
  </section>

  <section class="cards rev" aria-label="Motivos">
    <button class="card" type="button" aria-pressed="false"><span class="inn"><span class="face front"><b>Por despedirnos</b><span>Usted se encargó de nuestro último momento.</span></span><span class="face back"><b>Lo recuerdo</b><span>Esa despedida es algo que no voy a olvidar.</span></span></span></button>
    <button class="card" type="button" aria-pressed="false"><span class="inn"><span class="face front"><b>Por su tiempo</b><span>Se esforzo demasiado y todo se vio bien bonito.</span></span><span class="face back"><b>Se notó</b><span>Se nota cuando alguien lo hace con ganas.</span></span></span></button>
    <button class="card" type="button" aria-pressed="false"><span class="inn"><span class="face front"><b>Por sus palabras</b><span>Nos fuimos con algo bonito en la mente.</span></span><span class="face back"><b>Gracias</b><span>Me llevo sus palabras en esta nueva etapa.</span></span></span></button>
  </section>

  <section class="stage rev">
    <h2 class="disp">Un último abrazo</h2>
    <button class="hug" id="hug" type="button">Mandar un abrazo</button>
    <span class="count" id="count" aria-live="polite">Toca el botón. Cada abrazo lanza fuegos artificiales.</span>
  </section>

  <footer class="rev"><p class="disp">Gracias, Teacher Sardon.</p>Con cariño, el alumno Enzo.</footer>
</main>

<script>
(function(){
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  var cv=document.getElementById("fx"),cx=cv.getContext("2d"),ps=[],run=false;
  var cols=["#ffd166","#ff8fa3","#8fd3ff","#b8f2a0","#f6f3ea"],gl=["★","♥","✦","✎","♪"];
  function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
  function add(x,y,n,pw,g){
    if(reduce)return;
    for(var i=0;i<n;i++){var a=Math.random()*6.283,s=(.5+Math.random())*pw;
      ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-pw*.6,r:0,vr:(Math.random()-.5)*.3,g:gl[i%5],c:cols[i%5],sz:12+Math.random()*16,life:1,gr:g})}
    if(!run){run=true;loop()}
  }
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    ps=ps.filter(function(p){return p.life>0});
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=p.gr;p.vx*=.99;p.r+=p.vr;p.life-=.012;
      cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.font=p.sz+"px sans-serif";cx.fillText(p.g,0,0);cx.restore()});
    if(ps.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
  }
  function fireworks(){
    for(var k=0;k<5;k++)setTimeout(function(){add(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4),45,6,.1)},k*260);
  }
  addEventListener("pointerdown",function(e){if(!e.target.closest("#hug"))add(e.clientX,e.clientY,16,5,.14)});
  var last=0;
  addEventListener("pointermove",function(e){var n=Date.now();if(n-last>50){last=n;add(e.clientX,e.clientY,1,1.5,.03)}});

  var t=document.getElementById("title"),i=0;
  "Gracias, profe Sardon".split(" ").forEach(function(word){
    var w=document.createElement("span");w.className="w";w.setAttribute("aria-hidden","true");
    word.split("").forEach(function(ch){var l=document.createElement("span");l.className="l";l.textContent=ch;l.style.setProperty("--i",i++);w.appendChild(l)});
    t.appendChild(w);t.appendChild(document.createTextNode(" "));
  });
  var rib="Gracias ★ profe Sardon ♥ Gracias ✦ profe Sardon ♪ ";
  document.getElementById("rt").textContent=rib+rib+rib+rib;
  document.getElementById("rb").textContent=rib+rib+rib+rib;
  var orb=document.getElementById("orbit"),oi=["🎓","★","♥","✎","🎓","✦","♪","★"];
  oi.forEach(function(g,k){var s=document.createElement("span");s.textContent=g;s.style.setProperty("--a",(k*360/oi.length)+"deg");orb.appendChild(s)});

  var text="Hoy fue la despedida de 5.º y usted fue quien se encargó de despedirnos.\n\nAunque no fue mi tutor, quiero decirle gracias de verdad: por su tiempo, por sus palabras y por hacer que este final se sintiera especial.\n\nMe llevo este día conmigo.\n\nGracias, profe Sardon.";
  var started=false;
  function type(){
    if(started)return;started=true;var el=document.getElementById("typed");
    if(reduce){el.textContent=text;return}
    var p=0;(function step(){el.textContent=text.slice(0,++p);if(p<text.length)setTimeout(step,/[.\n]/.test(text[p-1])?260:38)})();
  }

  var cover=document.getElementById("cover");
  document.getElementById("open").addEventListener("click",function(){
    cover.classList.add("open");document.body.classList.remove("locked");
    fireworks();setTimeout(type,900);setTimeout(function(){cover.style.display="none"},1300);
  });

  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.2});
  document.querySelectorAll(".rev").forEach(function(r){io.observe(r)});

  if(!reduce){
    var sy=["★","♥","✦","✎","♪","🎓"];
    for(var d=0;d<36;d++){var s=document.createElement("span");s.className="doodle";s.textContent=sy[d%6];
      s.style.left=Math.random()*100+"vw";s.style.fontSize=18+Math.random()*28+"px";
      s.style.animationDuration=(14+Math.random()*20)+"s,"+(3+Math.random()*4)+"s";s.style.animationDelay=(-Math.random()*30)+"s,"+(-Math.random()*6)+"s";document.body.appendChild(s)}
  }

  if(!reduce){
    var bgEl=document.querySelector(".bg");
    for(var q=0;q<70;q++){var st=document.createElement("span");st.className="star";st.style.left=Math.random()*100+"%";st.style.top=Math.random()*100+"%";st.style.animationDelay=(-Math.random()*3)+"s";st.style.animationDuration=(2+Math.random()*3)+"s";bgEl.appendChild(st)}
    setInterval(function(){var sh=document.createElement("span");sh.className="shoot";sh.style.left=Math.random()*70+"vw";sh.style.top=Math.random()*40+"vh";document.body.appendChild(sh);setTimeout(function(){sh.remove()},1400)},1800);
  }
  var hugs=0,ct=document.getElementById("count");
  document.getElementById("hug").addEventListener("click",function(){
    hugs++;ct.textContent=hugs===1?"1 abrazo enviado. ¡Gracias, profe!":hugs+" abrazos enviados. ¡Gracias, profe!";fireworks();
  });
  document.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("click",function(){c.setAttribute("aria-pressed",c.getAttribute("aria-pressed")==="true"?"false":"true")})});
})();
</script>
</body>
</html>
